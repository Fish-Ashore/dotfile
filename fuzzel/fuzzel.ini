[main]
font = 0xproto nerd font:size=11, Noto Sans Mono:size=11, monospace:size=11

# ============================================================
# 基础设置
# ============================================================

# output=<not set>              # 指定显示在哪个输出（显示器）上，默认未设置（当前聚焦的显示器）
# font=monospace                # 指定字体，默认使用 monospace
# dpi-aware=auto                # 是否感知 DPI 缩放：auto（自动）、yes、no

prompt=>                          # 输入框前面的提示符，默认为 ">"

# icon-theme=hicolor            # 图标主题，默认 hicolor
# icons-enabled=yes             # 是否启用图标显示，默认 yes

# fields=filename,name,generic  # 从 .desktop 文件中读取哪些字段作为搜索匹配依据

# password-character=*          # 密码模式下的掩码字符（*）

fuzzy=yes                       # 是否启用模糊匹配，启用后拼写错误也能匹配

# show-actions=no               # 是否显示 .desktop 文件的 Actions（如“新建窗口”等）

# terminal=$TERMINAL -e         # 终端模拟器命令（注意：此处实际不支持环境变量展开）
# launch-prefix=<not set>       # 程序启动前缀（如用于包装命令的工具）

# ============================================================
# 界面尺寸与布局
# ============================================================

lines=15                        # 下拉列表中可见的行数

width=35                        # 窗口宽度（字符数单位）

horizontal-pad=40               # 窗口水平内边距（像素）

vertical-pad=8                  # 窗口垂直内边距（像素）

inner-pad=0                     # 列表项内部内边距（像素）

# image-size-ratio=0.5          # 图标大小相对于字体大小的比例（0.5 表示图标高度为字体高度的 50%）

# line-height=<use font metrics> # 行高，默认使用字体度量
# letter-spacing=0              # 字符间距（像素）

# ============================================================
# 窗口层级与行为
# ============================================================

# layer = top                   # 窗口层级：top（置顶）、normal、bottom
# exit-on-keyboard-focus-loss = yes  # 失去键盘焦点时自动退出

# ============================================================
# 颜色配置
# ============================================================

[colors]
background=282a36dd             # 背景色（十六进制 RGB + 透明度，dd ≈ 87% 不透明度）
text=f8f8f2ff                   # 普通文本颜色
match=8be9fdff                  # 匹配高亮颜色（当前输入匹配的部分）
selection-match=8be9fdff        # 选中项中匹配高亮的颜色
selection=44475add              # 选中项的背景色（add ≈ 68% 不透明度）
selection-text=f8f8f2ff         # 选中项的文本颜色
border=bd93f9ff                 # 边框颜色

# ============================================================
# 边框样式
# ============================================================

[border]
width=0                         # 边框宽度（像素），0 表示无边框
radius=5                        # 圆角半径（像素）

# ============================================================
# dmenu 兼容模式
# ============================================================

[dmenu]
# mode=text                     # 输出模式：text（输出选中文本）或 index（输出选中索引）
# exit-immediately-if-empty=no  # 输入为空时是否立即退出

# ============================================================
# 键盘快捷键绑定
# ============================================================

[key-bindings]

# --- 退出 ---
# cancel=Escape Control+g       # 取消/退出

# --- 选择执行 ---
# execute=Return KP_Enter Control+y     # 执行选中的条目
# execute-or-next=Tab                    # 执行当前选中，若无则跳转到下一个

# --- 光标移动 ---
# cursor-left=Left Control+b            # 光标左移一格
# cursor-left-word=Control+Left Mod1+b  # 光标左移一个单词
# cursor-right=Right Control+f          # 光标右移一格
# cursor-right-word=Control+Right Mod1+f # 光标右移一个单词
# cursor-home=Home Control+a            # 光标移到行首
# cursor-end=End Control+e              # 光标移到行尾

# --- 删除操作 ---
# delete-prev=BackSpace                 # 删除前一个字符
# delete-prev-word=Mod1+BackSpace Control+BackSpace  # 删除前一个单词
# delete-next=Delete                    # 删除后一个字符
# delete-next-word=Mod1+d Control+Delete # 删除后一个单词
# delete-line=Control+k                 # 删除光标到行尾的所有内容

# --- 列表导航 ---
# prev=Up Control+p                     # 选择上一项
# prev-with-wrap=ISO_Left_Tab           # 选择上一项（循环）
# prev-page=PageUp KP_PageUp            # 向上翻一页
# next=Down Control+n                   # 选择下一项
# next-with-wrap=none                   # 选择下一项（循环），未设置
# next-page=Page_Down KP_PageDown       # 向下翻一页

# --- 自定义快捷键（dmenu 模式专用）---
# 按下后执行选中项并以特定退出码退出：
# custom-1 退出码 10，custom-2 退出码 11，以此类推
# custom-1=Mod1+1
# custom-2=Mod1+2
# custom-3=Mod1+3
# custom-4=Mod1+4
# custom-5=Mod1+5
# custom-6=Mod1+6
# custom-7=Mod1+7
# custom-8=Mod1+8
# custom-9=Mod1+9
# custom-10=Mod1+0
# custom-11=Mod1+exclam
# custom-12=Mod1+at
# custom-13=Mod1+numbersign
# custom-14=Mod1+dollar
# custom-15=Mod1+percent
# custom-16=Mod1+dead_circumflex
# custom-17=Mod1+ampersand
# custom-18=Mod1+asterix
# custom-19=Mod1+parentleft
