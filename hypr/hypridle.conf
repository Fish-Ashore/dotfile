general {
    # 当收到锁屏请求时，确保只启动一个 hyprlock 实例
    lock_cmd = pidof hyprlock || hyprlock
    # 在系统休眠前，通过 logind 锁定会话，这会触发上面的 lock_cmd
    before_sleep_cmd = loginctl lock-session
    # 唤醒后，确保屏幕亮起 (有时需要按两次键，此命令可解决)
    after_sleep_cmd = hyprctl dispatch dpms on
    # 关键：让系统等待 hyprlock 完全渲染后再休眠，避免唤醒时闪屏
    inhibit_sleep = 3
}

# 可选的监听器，用于处理空闲超时
listener {
    # 5分钟后锁定屏幕[reference:3]
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    # 30分钟后休眠[reference:4]
    timeout = 600
    on-timeout = systemctl suspend
}
